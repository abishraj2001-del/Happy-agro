<!DOCTYPE html>
<html>
<head>
  <title>Oyster Mushroom Order</title>
</head>
<body>
<h3>Oyster Mushroom – Farm Direct</h3>

<button onclick="openMap()">Check Delivery Distance</button>
<br><br>
<button onclick="openWhatsApp()">Book Order on WhatsApp</button>

<script>
const FARM_LAT = 8.335032617156168;   // your farm latitude
const FARM_LNG = 77.25220572279326;   // your farm longitude
const WHATSAPP_NUMBER = "918883686153"; // your WhatsApp number

let userLat, userLng;

function openMap() {
  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;

    window.open(
      `https://www.google.com/maps/dir/?api=1&origin=${FARM_LAT},${FARM_LNG}&destination=${userLat},${userLng}&travelmode=driving`,
      "_blank"
    );
  }, () => {
    alert("Please allow location");
  });
}

function openWhatsApp() {
  if (!userLat || !userLng) {
    alert("Please check distance first");
    return;
  }

  const locationLink = `https://maps.google.com/?q=${userLat},${userLng}`;
  const message =
    "Hello, I want to order Oyster Mushrooms 🍄%0A" +
    "I am within 5 km free delivery zone.%0A" +
    "📍 My location:%0A" +
    locationLink;

  window.location.href =
    `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;
}
</script>
</body>
</html>
